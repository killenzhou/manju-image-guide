<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>VFX Director Host Harness</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #0c0e12; color: #eee; font-family: system-ui; }
      body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
      iframe { width: 100%; height: 100%; border: 0; }
      aside { padding: 16px; border-left: 1px solid #343944; overflow: auto; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
    </style>
  </head>
  <body>
    <iframe id="app" src="/index.html"></iframe>
    <aside><h1>Host events</h1><pre id="events">waiting</pre></aside>
    <script>
      const iframe = document.querySelector("#app");
      const events = document.querySelector("#events");
      window.__vfxHostState = { methods: [], context: null, message: null };
      const render = () => {
        const state = window.__vfxHostState;
        events.textContent = JSON.stringify({
          methods: state.methods,
          contextImages: state.context?.content?.filter((item) => item.type === "image").length || 0,
          contextText: state.context?.content?.find((item) => item.type === "text")?.text?.slice(0, 120) || "",
          messageText: state.message?.content?.find((item) => item.type === "text")?.text || "",
        }, null, 2);
      };
      const send = (payload) => iframe.contentWindow.postMessage(payload, "*");
      window.addEventListener("message", (event) => {
        if (event.source !== iframe.contentWindow || event.data?.jsonrpc !== "2.0") return;
        const message = event.data;
        if (message.method) window.__vfxHostState.methods.push(message.method);
        if (message.method === "ui/initialize") {
          send({ jsonrpc: "2.0", id: message.id, result: {
            protocolVersion: "2026-01-26",
            hostInfo: { name: "vfx-director-test-host", version: "1.0.0" },
            hostCapabilities: {
              serverTools: {},
              updateModelContext: { text: {}, image: {} },
              message: { text: {}, image: {} },
            },
            hostContext: { displayMode: "fullscreen", theme: "dark", platform: "desktop" },
          } });
        } else if (message.method === "ui/request-display-mode") {
          send({ jsonrpc: "2.0", id: message.id, result: { mode: "fullscreen" } });
        } else if (message.method === "ui/update-model-context") {
          window.__vfxHostState.context = message.params;
          send({ jsonrpc: "2.0", id: message.id, result: {} });
        } else if (message.method === "ui/message") {
          window.__vfxHostState.message = message.params;
          send({ jsonrpc: "2.0", id: message.id, result: {} });
        } else if (message.id != null) {
          send({ jsonrpc: "2.0", id: message.id, result: {} });
        }
        if (message.method === "ui/notifications/initialized") {
          send({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: {
            content: [{ type: "text", text: "VFX Director 已打开。" }],
            structuredContent: { launch: { workspaceRoot: "C:\\vfx-test", effectHint: "" } },
          } });
        }
        render();
      });
    </script>
  </body>
</html>
