<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>创意参考搜索 · 候选板</title>
<style>
:root{color-scheme:dark;--ink:#f1f4f5;--sub:#a4b0b8;--surface:#161e24;--line:#30404b;--accent:#a7e7cd}
*{box-sizing:border-box}
body{margin:0;background:#10161b;color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1350px;margin:auto;padding:36px clamp(16px,4vw,58px) 68px}
header{padding-bottom:25px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{font-size:clamp(27px,4vw,44px);line-height:1.16;letter-spacing:-.025em;margin:0 0 12px}
p{margin:0}
.query{font-size:clamp(15px,2vw,19px);color:#d8e3e7;overflow-wrap:anywhere}
.small{color:var(--sub);font-size:13px}
.toolbar,.pagination,.filters,.actions,.cardhead,.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{justify-content:space-between;margin:18px 0 10px}
.pagination{margin:12px 0 17px}
.pagination .small{min-width:130px}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:6px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button[aria-pressed="true"],.primary{background:var(--accent);color:#101e19;border-color:var(--accent);font-weight:650}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=text]{width:min(360px,100%);padding:6px 8px;font:inherit;background:#0d151b;color:var(--ink);border:1px solid var(--line);border-radius:6px}
.manual{margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
article{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px;display:flex;flex-direction:column;gap:9px;overflow-wrap:anywhere}
article.selected{border-color:var(--accent)}
.cardhead{justify-content:space-between}
.id{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700}
.score{color:#c2ebff;font-variant-numeric:tabular-nums}
h2{font-size:17px;line-height:1.4;margin:0}
a{color:var(--accent);text-underline-offset:3px}
h2 a{color:var(--ink);text-decoration:none}
h2 a:hover{text-decoration:underline}
.reason{color:#d4dfe4;min-height:44px}
.thumb{width:100%;height:150px;object-fit:contain;background:#0c1115;border-radius:6px}
.meta{color:var(--sub);font-size:12px}
.archive{color:#e6c997}
.choose{display:flex;gap:7px;align-items:center;margin-top:auto;padding-top:4px;min-height:28px;cursor:pointer}
.foot{margin-top:18px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.grid{grid-template-columns:minmax(0,1fr)}main{padding-top:22px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>创意参考搜索</h1>
    <p class="query" id="query"></p>
  </header>
  <div class="toolbar">
    <div class="filters" id="filters" aria-label="按方向筛选"></div>
    <div class="actions">
      <span class="small" id="picked" aria-live="polite"></span>
      <button id="copy" class="primary" type="button">复制选中编号</button>
      <button id="clear" type="button">清空</button>
    </div>
  </div>
  <p class="small">每批最多 20 条。勾选可跨批保留；把编号发回聊天后，再保存你选中的参考。</p>
  <div class="manual" id="manual" hidden>
    <label for="selection-text">手动复制编号：</label>
    <input id="selection-text" type="text" readonly>
  </div>
  <nav class="pagination" aria-label="候选翻批">
    <button id="prev" type="button">上一批</button>
    <span class="small" id="count" aria-live="polite"></span>
    <button id="next" type="button">换一批 →</button>
  </nav>
  <section id="cards" class="grid" aria-label="搜索候选"></section>
  <p class="foot small">排名由相似度和参考价值主导。互动按来源显示；未取到数据不等于零。片段与画面核对状态见卡片。</p>
</main>
<script type="application/json" id="data">/*REFERENCE_SNAPSHOT*/</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#data').textContent);
const get = id => document.getElementById(id);
const groups = [null, ...data.groups];
const ids = new Set(data.items.map(item => item.id));
const labels = {views:'播放',likes:'点赞',comments:'评论',saves:'收藏'};
const storageKey = 'creative-ref:' + location.pathname + ':' + data.query;
let state = {group:0, page:0, picked:[]};
try {
  const previous = JSON.parse(localStorage.getItem(storageKey) || 'null');
  if (previous) state = {
    group:Number.isInteger(previous.group) && groups[previous.group] !== undefined ? previous.group : 0,
    page:Number.isInteger(previous.page) ? Math.max(previous.page,0) : 0,
    picked:Array.isArray(previous.picked) ? previous.picked.filter(id => ids.has(id)) : []
  };
} catch (_) {}
const picked = new Set(state.picked);
function node(tag, text, css) {
  const e = document.createElement(tag);
  if (text !== null) e.textContent = text;
  if (css) e.className = css;
  return e;
}
function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify({...state, picked:[...picked]})); } catch (_) {}
}
function picks() {
  get('picked').textContent = '已选 ' + picked.size;
  get('copy').disabled = get('clear').disabled = picked.size === 0;
  get('copy').textContent = '复制选中编号';
  get('manual').hidden = true;
}
function seconds(value) {
  return value >= 60 ? Math.floor(value/60) + ':' + (value%60).toFixed(1).padStart(4,'0')
                     : value.toFixed(1) + ' 秒';
}
function card(item) {
  const article = node('article',null,picked.has(item.id) ? 'selected' : '');
  article.dataset.id = item.id;
  const head = node('div',null,'cardhead');
  head.append(node('span','#' + item.id + ' · ' + item.category,'id'),
              node('span','相似 ' + item.match + ' · 综合 ' + item.score,'score'));
  const title = node('h2',null);
  const link = node('a',item.title);
  link.href = item.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
  title.append(link);
  article.append(head, title);
  if (item.preview) {
    const image = node('img',null,'thumb');
    image.loading = 'lazy'; image.alt = item.title + '的预览';
    image.addEventListener('error', () => image.remove());
    image.src = item.preview;
    article.append(image);
  }
  article.append(node('p',item.reason,'reason'));
  const info = node('div',null,'meta');
  const time = item.segment ? item.segment.map(seconds).join(' – ') : (
      item.kind === 'video' ? '片段待核对' : '');
  info.append(node('span',item.source), node('span',item.verified === 'media' ? '已核对媒体' : '据网页资料'));
  if (time) info.append(node('span',time));
  article.append(info);
  const stats = Object.keys(labels).filter(k => item.metrics[k] !== null).map(k =>
    labels[k] + ' ' + item.metrics[k].toLocaleString('zh-CN'));
  const stat = node('p',stats.length ? stats.join(' · ') : '互动数据未获取','small');
  if (item.metrics.as_of) stat.title = '读取日期：' + item.metrics.as_of;
  article.append(stat, node('p',item.archive === 'eligible' ? '可申请入库' : '默认仅收藏链接','meta archive'));
  const choose = node('label',null,'choose');
  const checkbox = node('input',null);
  checkbox.type = 'checkbox'; checkbox.checked = picked.has(item.id);
  checkbox.setAttribute('aria-label','选中 ' + item.id + ' ' + item.title);
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) picked.add(item.id); else picked.delete(item.id);
    article.classList.toggle('selected',checkbox.checked);
    picks(); persist();
  });
  choose.append(checkbox,node('span','加入选中'));
  article.append(choose);
  return article;
}
function render() {
  const group = groups[state.group];
  const items = group === null ? data.items : data.items.filter(x => x.category === group);
  const pages = Math.max(1,Math.ceil(items.length/20));
  state.page = Math.min(state.page,pages-1);
  const offset = state.page*20;
  const subset = items.slice(offset,offset+20);
  get('query').textContent = data.query;
  get('filters').replaceChildren(...groups.map((name,i) => {
    const button = node('button',name || '全部');
    button.type = 'button'; button.setAttribute('aria-pressed',String(i === state.group));
    button.onclick = () => {state.group = i; state.page = 0; render();};
    return button;
  }));
  get('prev').disabled = state.page === 0;
  get('next').disabled = state.page + 1 >= pages;
  get('count').textContent = subset.length ? '第 ' + (offset+1) + '–' + (offset+subset.length) +
    ' 条 / 共 ' + items.length + ' 条' : '没有合格候选';
  get('cards').replaceChildren(...subset.map(card));
  picks(); persist();
}
get('prev').onclick = () => {state.page--; render();};
get('next').onclick = () => {state.page++; render();};
get('clear').onclick = () => {picked.clear(); render();};
get('copy').onclick = async () => {
  const text = '选中候选：' + [...picked].sort((a,b) => Number(a)-Number(b)).join('、');
  try {
    await navigator.clipboard.writeText(text);
    get('copy').textContent = '已复制';
  } catch (_) {
    get('manual').hidden = false;
    const field = get('selection-text'); field.value = text; field.focus(); field.select();
  }
};
render();
</script>
</body>
</html>
